<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play-Money Crash Game</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
body { background:#0f0f1a; color:#fff; font-family:sans-serif; text-align:center; }
#multiplier { font-size:64px; margin:20px; }
#canvas { background:#1a1a2e; border-radius:8px; max-width:95%; }
button { font-size:18px; padding:10px 20px; margin:5px; border:none; border-radius:6px; cursor:pointer; }
#betBtn { background:#4caf50; color:#fff; }
#cashoutBtn { background:#f44336; color:#fff; }
input { font-size:18px; padding:8px; width:100px; }
</style>
</head>
<body>
<h1>Crash (Play Money)</h1>
<p>Balance: <span id="balance">-</span> credits</p>
<div id="multiplier">1.00x</div>
<canvas id="canvas" width="600" height="300"></canvas>
<br>
<input id="betAmount" type="number" value="100">
<button id="betBtn" onclick="placeBet()">Bet</button>
<button id="cashoutBtn" onclick="cashOut()">Cash Out</button>
<p id="status">Connecting...</p>

<script>
const socket = io();
let sessionId = null;
let balance = 0;
let history = [];

async function join() {
  const res = await fetch('/api/join', { method: 'POST' });
  const data = await res.json();
  sessionId = data.session_id;
  balance = data.balance;
  document.getElementById('balance').innerText = (balance/100).toFixed(2);
}
join();

async function placeBet() {
  const amount = Math.round(document.getElementById('betAmount').value * 100);
  const res = await fetch('/api/bet', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({session_id: sessionId, amount: amount})
  });
  const data = await res.json();
  if (data.balance !== undefined) {
    balance = data.balance;
    document.getElementById('balance').innerText = (balance/100).toFixed(2);
    document.getElementById('status').innerText = 'Bet placed!';
  } else {
    document.getElementById('status').innerText = data.error;
  }
}

async function cashOut() {
  const res = await fetch('/api/cashout', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({session_id: sessionId})
  });
  const data = await res.json();
  if (data.balance !== undefined) {
    balance = data.balance;
    document.getElementById('balance').innerText = (balance/100).toFixed(2);
    document.getElementById('status').innerText =
      'Cashed out at ' + data.cashed_out_at.toFixed(2) + 'x, won ' + (data.winnings/100).toFixed(2);
  } else {
    document.getElementById('status').innerText = data.error;
  }
}

socket.on('round_waiting', (data) => {
  document.getElementById('status').innerText = 'Betting open! Seed hash: ' + data.seed_hash.slice(0,16) + '...';
  document.getElementById('multiplier').innerText = '1.00x';
  history = [];
  clearCanvas();
});

socket.on('round_started', () => {
  document.getElementById('status').innerText = 'Round running!';
});

socket.on('state_update', (data) => {
  document.getElementById('multiplier').innerText = data.multiplier.toFixed(2) + 'x';
  if (data.phase === 'running' || data.phase === 'crashed') {
    history.push(data.multiplier);
    drawCurve();
  }
});

socket.on('round_crashed', (data) => {
  document.getElementById('status').innerText =
    'Crashed at ' + data.crash_point.toFixed(2) + 'x. Seed revealed: ' + data.server_seed.slice(0,16) + '...';
});

function clearCanvas() {
  const ctx = document.getElementById('canvas').getContext('2d');
  ctx.clearRect(0, 0, 600, 300);
}

function drawCurve() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 600, 300);
  ctx.strokeStyle = '#4caf50';
  ctx.lineWidth = 3;
  ctx.beginPath();
  history.forEach((m, i) => {
    const x = i * (600 / Math.max(history.length, 100));
    const y = 300 - Math.min((m - 1) * 60, 290);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
}
</script>
</body>
</html>
